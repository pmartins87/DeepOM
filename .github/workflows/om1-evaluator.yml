name: DeepOM math, mechanics and economy validation

on:
  push:
    branches: [main]
    paths:
      - "deepom/**"
      - "tests/**"
      - "tools/validate_om1_exhaustive.py"
      - "tools/validate_om2_jackpot_exhaustive.py"
      - "tools/census_om4_preflop.py"
      - "tools/analyze_economy_sensitivity.py"
      - "tools/differential_treys_omaha.py"
      - "tools/profile_om6_hotpath.py"
      - ".github/workflows/om1-evaluator.yml"
  pull_request:
    paths:
      - "deepom/**"
      - "tests/**"
      - "tools/validate_om1_exhaustive.py"
      - "tools/validate_om2_jackpot_exhaustive.py"
      - "tools/census_om4_preflop.py"
      - "tools/analyze_economy_sensitivity.py"
      - "tools/differential_treys_omaha.py"
      - "tools/profile_om6_hotpath.py"
      - ".github/workflows/om1-evaluator.yml"

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check treys==0.1.8 numpy==2.3.5
      - name: Unit, Omaha-rule, equity, action-tree, economy and solver tests
        run: python -m unittest discover -s tests -v
      - name: Independent OM1 differential vs Treys
        run: python tools/differential_treys_omaha.py
      - name: Exhaustive OM1 five-card frequency validation
        run: python tools/validate_om1_exhaustive.py
      - name: Exhaustive OM2 Omaha Royal Flush probability validation
        run: python tools/validate_om2_jackpot_exhaustive.py
      - name: Exact OM4 PLO4 preflop suit-isomorphism census
        run: python tools/census_om4_preflop.py
      - name: Exact promotion/economy sensitivity census
        run: python tools/analyze_economy_sensitivity.py
      - name: OM6 profiler smoke test
        run: |
          python tools/profile_om6_hotpath.py             --mode 2w             --deals 2             --seed 1             --output-json /tmp/om6_profile.json             --output-text /tmp/om6_profile.txt             --output-prof /tmp/om6_profile.prof
          python - <<'PY'
          import json
          p = json.load(open("/tmp/om6_profile.json", encoding="utf-8"))
          assert p["deals"] == 2
          assert p["high_level_attribution"]["provisional_dominant_family"] in {
              "omaha_evaluator",
              "plo4_canonicalization_lookup",
              "cfr_python_and_other",
          }
          print("OM6_PROFILER_SMOKE=PASS")
          PY
